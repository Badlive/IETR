<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расхождение количества продукции</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #ffffff, #3a248a);
            color: #000000;
            font-family: 'Times New Roman', bold;
        }

        .navbar {
            background-color: #290c53;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            color: #ffffff;
            font-weight: bold;
        }

        .container {
            margin-top: 50px;
        }

        .info-section {
            margin-top: 50px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-container .btn {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn-container .btn:hover {
            transform: scale(1.05);
            background-color: #0056b3;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<!-- Навбар -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Интерактивное электронное техническое руководство для ПО учета продукции</a>
    </div>
</nav>

<div class="container text-center btn-container">
    <h1>Расхождение количества продукции</h1>
    <div id="question1">
        <p>Оповести администратора<br>Возможно ли поменять кол-во в накладной?</p>
        <button class="btn btn-primary btn-lg" onclick="handleYes()">Да</button>
        <button class="btn btn-primary btn-lg" onclick="handleNo()">Нет</button>
    </div>

    <div id="answerYes" class="hidden">
        <p>Изменить кол-во и загрузить исправленную версию.</p>
        <a href="fixes.html" class="btn btn-primary btn-lg">Назад</a>
    </div>

    <div id="answerNo" class="hidden">
        <p>Обратиться к сисадмину.</p>
        <a href="fixes.html" class="btn btn-primary btn-lg">Назад</a>
    </div>

</div>

<!-- Подключение Bootstrap JS и зависимости -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    function handleYes() {
        document.getElementById('question1').classList.add('hidden');
        document.getElementById('answerYes').classList.remove('hidden');
    }

    function handleNo() {
        document.getElementById('question1').classList.add('hidden');
        document.getElementById('answerNo').classList.remove('hidden');
    }

    function nextStep() {
        document.getElementById('answerYes').classList.add('hidden');
        document.getElementById('answerNo').classList.add('hidden');
        document.getElementById('question2').classList.remove('hidden');
    }

    function handleYes2() {
        document.getElementById('question2').classList.add('hidden');
        document.getElementById('answerYes2').classList.remove('hidden');
    }

    function handleNo2() {
        document.getElementById('question2').classList.add('hidden');
        document.getElementById('answerNo2').classList.remove('hidden');
    }

    function nextStep2() {
        document.getElementById('answerNo2').classList.add('hidden');
        document.getElementById('question3').classList.remove('hidden');
    }

    function handleYes3() {
        document.getElementById('question3').classList.add('hidden');
        document.getElementById('answerYes3').classList.remove('hidden');
    }

    function handleNo3() {
        document.getElementById('question3').classList.add('hidden');
        document.getElementById('answerNo3').classList.remove('hidden');
    }
</script>
</body>
</html>
